[project]
name = "codex-parallel-infra"
version = "0.1.0"
description = "Hub service that fans out data-filtering tasks to Codex CLI instances running in sandboxes"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "typer>=0.12", "httpx>=0.27"]
e2b = ["e2b-code-interpreter>=1.0"]

[project.scripts]
codex-parallel = "codex_parallel_cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codex_parallel", "codex_parallel.backends", "codex_parallel_cli"]

[tool.setuptools.package-dir]
codex_parallel = "src/codex_parallel"
codex_parallel_cli = "cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
